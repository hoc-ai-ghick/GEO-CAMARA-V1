<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Evita que el usuario haga zoom por error en el celular -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cámara Topográfica PWA</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    <style>
        /* Solución al encuadre móvil: Bloquea el tamaño exacto de la pantalla visible (dvh) */
        html, body { 
            margin: 0; padding: 0; 
            width: 100%; height: 100%; 
            height: 100dvh; /* Altura dinámica para evadir barras de navegadores móviles */
            background: #000; color: white; font-family: sans-serif; 
            overflow: hidden; 
            position: fixed; /* Mantiene la app inmóvil y encajada */
        }
        
        #camera-container { 
            position: absolute; 
            top: 0; left: 0; right: 0; bottom: 0; 
            display: flex; justify-content: center; align-items: center; 
        }
        
        video { 
            position: absolute; 
            width: 100%; height: 100%; 
            object-fit: cover; /* Evita que la cámara se vea estirada o deforme */
            z-index: 1; 
        }
        canvas { display: none; }
        
        /* Logo (Derecha superior) */
        #logo-preview { 
            position: absolute; 
            top: 20px; right: 20px; 
            z-index: 10; width: clamp(60px, 15vw, 100px); opacity: 0.9; 
        }

        /* Controles inferiores (Panel y Botón) */
        .bottom-bar { 
            position: absolute; z-index: 20; 
            bottom: 0; left: 0; width: 100%; 
            padding: 15px; box-sizing: border-box; 
            background: linear-gradient(transparent, rgba(0,0,0,0.8)); 
            display: flex; flex-direction: row; justify-content: space-between; align-items: flex-end;
        }

        /* Adaptación automática para cuando el celular esté en Vertical (Portrait) */
        @media (max-width: 600px) {
            .bottom-bar {
                flex-direction: column;
                align-items: center;
                gap: 15px;
                padding-bottom: 30px; /* Margen extra para celulares sin botones físicos */
            }
            .naming-panel { width: 100%; justify-content: center; }
        }
        
        /* Panel de nomenclatura */
        .naming-panel { 
            display: flex; gap: 5px; flex-wrap: wrap;
            background: rgba(0,0,0,0.6); padding: 10px; border-radius: 8px; 
        }
        .naming-panel select, .naming-panel input {
            font-size: 16px; padding: 6px; border: none; border-radius: 4px;
        }
        .naming-panel select { color: red; font-weight: bold; background: #fff; }
        .naming-panel input[type="number"] { width: 60px; text-align: center; }
        .naming-panel input[type="text"] { flex-grow: 1; max-width: 150px; text-align: left; }
        
        /* Botón de captura */
        #capture-btn { 
            background: #fff; border: 5px solid #aaa; 
            width: 70px; height: 70px; border-radius: 50%; 
            cursor: pointer; flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #capture-btn:active { background: #ccc; transform: scale(0.95); }
    </style>
</head>
<body>

<div id="camera-container">
    <video id="video" autoplay playsinline></video>
    
    <!-- Carga tu logo directamente desde GitHub -->
    <img id="logo-preview" src="logo.png" alt="Logo" crossorigin="anonymous" onerror="this.src='https://via.placeholder.com/150?text=LOGO'">
    
    <div class="bottom-bar">
        <!-- Panel Izquierdo: Nomenclatura -->
        <div class="naming-panel">
            <select id="prefix">
                <option value="GEO">GEO</option>
                <option value="GEONORT">GEONORT</option>
                <option value="EST">EST</option>
                <option value="CAL">CAL</option>
            </select>
            <span style="color:white; align-self:center; font-weight:bold;">_</span>
            <input type="number" id="num" placeholder="066" value="066">
            <span style="color:white; align-self:center; font-weight:bold;">_</span>
            <input type="text" id="desc" placeholder="descripción">
        </div>
        
        <!-- Botón de captura centrado/derecha -->
        <button id="capture-btn"></button>
    </div>
    
    <canvas id="canvas"></canvas>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let currentData = { lat: 0, lon: 0, alt: 0, utmE: 0, utmN: 0, address: "Buscando ubicación..." };

    // Solicitar explícitamente la cámara trasera a máxima resolución
    const constraints = {
        video: { 
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 }, 
            height: { ideal: 1080 } 
        }
    };

    navigator.mediaDevices.getUserMedia(constraints)
        .then(stream => video.srcObject = stream)
        .catch(err => alert("Error al acceder a la cámara: " + err));

    // Obtener Geolocalización
    if (navigator.geolocation) {
        navigator.geolocation.watchPosition(async position => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            currentData.alt = position.coords.altitude ? position.coords.altitude.toFixed(2) : "N/D";
            
            // Conversión UTM
            const utmZone = Math.floor((lon + 180) / 6) + 1;
            proj4.defs(`EPSG:UTM${utmZone}`, `+proj=utm +zone=${utmZone} +datum=WGS84 +units=m +no_defs`);
            const utm = proj4('EPSG:4326', `EPSG:UTM${utmZone}`, [lon, lat]);
            currentData.utmE = utm[0].toFixed(2);
            currentData.utmN = utm[1].toFixed(2);

            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                const data = await res.json();
                const d = data.address;
                currentData.address = `${d.county || d.city || ''}, ${d.state || ''}, ${d.country || ''}`;
            } catch(e) { currentData.address = "Coordenadas obtenidas"; }

            currentData.lat = lat;
            currentData.lon = lon;
        }, err => console.warn(err), { enableHighAccuracy: true });
    }

    // Acción al tomar la foto
    document.getElementById('capture-btn').addEventListener('click', () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // Tamaños proporcionales a la resolución de la cámara del celular
        const w = canvas.width;
        const h = canvas.height;
        const fontSize = Math.max(Math.floor(w * 0.018), 16); 
        
        // 1. Dibujar Logo
        const logo = document.getElementById('logo-preview');
        const logoSize = w * 0.15; // 15% del ancho de la foto
        ctx.drawImage(logo, w - logoSize - (w*0.02), h*0.02, logoSize, logoSize * (logo.height/logo.width));

        // 2. Dibujar cuadro de texto inferior derecho (Coordenadas)
        const now = new Date();
        const dateStr = now.toLocaleDateString('es-PE');
        const timeStr = now.toLocaleTimeString('es-PE');
        
        const rectW = w * 0.45;
        const rectH = fontSize * 6.5;
        const padX = w * 0.02;
        const padY = h * 0.02;
        
        ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
        ctx.fillRect(w - rectW - padX, h - rectH - padY, rectW, rectH);
        
        ctx.fillStyle = "white";
        ctx.font = `bold ${fontSize}px Arial`;
        ctx.fillText(currentData.address, w - rectW, h - rectH + fontSize);
        ctx.fillText(`E: ${currentData.utmE}   N: ${currentData.utmN}`, w - rectW, h - rectH + (fontSize * 2.5));
        ctx.fillText(`${dateStr} ${timeStr}`, w - rectW, h - rectH + (fontSize * 4));
        ctx.fillText(`Altitud: ${currentData.alt} msnm`, w - rectW, h - rectH + (fontSize * 5.5));

        // 3. Dibujar nombre de la foto (Inferior Izquierda)
        const prefix = document.getElementById('prefix').value;
        const num = document.getElementById('num').value.padStart(3, '0');
        const desc = document.getElementById('desc').value;
        const fileName = `${prefix}_${num}${desc ? '_' + desc : ''}`;

        ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
        ctx.fillRect(padX, h - (fontSize * 3) - padY, w * 0.4, fontSize * 3);
        
        ctx.fillStyle = "red";
        ctx.fillText(`${prefix}_`, padX + 20, h - padY - (fontSize * 0.8));
        ctx.fillStyle = "white";
        const offset = ctx.measureText(`${prefix}_`).width;
        ctx.fillText(`${num}_${desc}`, padX + 20 + offset, h - padY - (fontSize * 0.8));

        // Descargar Imagen
        const link = document.createElement('a');
        link.download = fileName + '.jpg'; // Asegura que se guarde con el nombre del input
        link.href = canvas.toDataURL('image/jpeg', 0.95);
        link.click();
    });
</script>
</body>
</html>
