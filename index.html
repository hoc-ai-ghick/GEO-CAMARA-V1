<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>Cámara Topográfica Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    
    <style>
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100dvh; 
            background: #000; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            overflow: hidden; position: fixed; 
            touch-action: none;
        }
        #camera-container { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; align-items: center; }
        video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        canvas { display: none; }
        
        .top-controls {
            position: absolute; top: 20px; left: 20px; z-index: 50;
            display: flex; gap: 10px;
        }
        .top-btn {
            background: rgba(0,0,0,0.6); color: white; border: 1px solid rgba(255,255,255,0.3);
            border-radius: 8px; padding: 10px 15px; cursor: pointer; font-size: 20px;
            backdrop-filter: blur(4px); box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            display: flex; justify-content: center; align-items: center;
        }
        .top-btn:active { background: rgba(255,255,255,0.3); }

        #logo-preview { 
            position: absolute; top: 20px; right: 20px; z-index: 50; 
            width: clamp(60px, 15vw, 100px); opacity: 1; 
        }

        /* ----- MÓDULO DE ZOOM POR BOTONES ----- */
        .zoom-panel {
            display: none; /* Se activa por JS si hay soporte */
            flex-direction: row;
            gap: 5px;
            background: rgba(10, 10, 12, 0.75);
            padding: 5px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(8px);
            z-index: 50;
            pointer-events: auto;
        }
        
        .zoom-btn {
            background: transparent; color: white; border: none;
            width: 40px; height: 40px; border-radius: 50%; 
            font-weight: bold; font-size: 13px; cursor: pointer; 
            display: flex; justify-content: center; align-items: center;
            transition: all 0.2s;
        }
        .zoom-btn.active { 
            background: #F44336; 
            box-shadow: 0 2px 8px rgba(244, 67, 54, 0.5);
        }

        /* Panel Inferior */
        .bottom-bar { 
            position: absolute; z-index: 20; bottom: 0; left: 0; width: 100%; 
            padding: 15px; box-sizing: border-box; 
            background: linear-gradient(transparent, rgba(0,0,0,0.9)); 
            display: flex; flex-direction: row; justify-content: space-between; align-items: flex-end;
            pointer-events: none; /* Permite toques al video */
        }
        
        .panel-container { 
            display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 300px; 
            pointer-events: auto;
        }
        
        .input-group { display: flex; gap: 5px; flex-wrap: wrap; background: rgba(20,20,20,0.75); padding: 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(4px); }
        .input-group select, .input-group input { font-size: 14px; padding: 6px; border: none; border-radius: 4px; background: rgba(255,255,255,0.9); font-family: 'Roboto Mono', monospace; }
        .input-group select { color: #d32f2f; font-weight: bold; }
        .input-group input[type="number"] { width: 50px; text-align: center; }
        .input-group input[type="text"] { flex-grow: 1; min-width: 100px; }
        
        .project-input { width: 100%; box-sizing: border-box; background: rgba(20,20,20,0.75) !important; color: white !important; border: 1px solid rgba(255,255,255,0.2) !important; }
        .project-input::placeholder { color: rgba(255,255,255,0.5); }

        /* Contenedor de Captura y Zoom (Derecha) */
        .action-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            pointer-events: auto;
        }

        #capture-btn { 
            background: rgba(255,255,255,0.9); border: 4px solid #fff; outline: 3px solid rgba(255,255,255,0.3);
            width: 75px; height: 75px; border-radius: 50%; cursor: pointer; flex-shrink: 0; box-shadow: 0 4px 15px rgba(0,0,0,0.6); transition: all 0.2s;
        }
        #capture-btn:active { background: #d32f2f; border-color: #d32f2f; transform: scale(0.9); }

        /* Adaptación móvil vertical (Portrait) */
        @media (max-width: 600px) {
            .bottom-bar { flex-direction: column; align-items: center; gap: 20px; padding-bottom: 30px; }
            .panel-container { width: 100%; justify-content: center; }
            .action-container { flex-direction: row-reverse; width: 100%; justify-content: space-between; padding: 0 10px; }
        }
    </style>
</head>
<body>

<div id="camera-container">
    <video id="video" autoplay playsinline></video>
    
    <div class="top-controls">
        <button id="fullscreen-btn" class="top-btn" title="Pantalla Completa">⛶</button>
        <button id="rotate-btn" class="top-btn" title="Forzar Rotación">🔄</button>
    </div>

    <img id="logo-preview" src="logo.png" alt="Logo" crossorigin="anonymous" onerror="this.src='https://via.placeholder.com/150?text=LOGO'">
    
    <div class="bottom-bar">
        <div class="panel-container">
            <div class="input-group" style="padding: 4px 8px;">
                <input type="text" id="project" class="project-input" placeholder="Nombre del Proyecto (Opcional)">
            </div>
            <div class="input-group">
                <select id="prefix">
                    <option value="GEO">GEO</option>
                    <option value="GEONORT">GEONORT</option>
                    <option value="EST">EST</option>
                    <option value="CAL">CAL</option>
                    <option value="_ADD_" style="color: blue;">+ Añadir...</option>
                </select>
                <input type="number" id="num" placeholder="001" value="001">
                <input type="text" id="desc" placeholder="Descripción">
            </div>
        </div>
        
        <div class="action-container">
            <!-- Panel de Zoom -->
            <div id="zoom-panel" class="zoom-panel">
                <button class="zoom-btn" data-zoom="0.5" id="btn-05x" style="display:none;">.5x</button>
                <button class="zoom-btn active" data-zoom="1" id="btn-1x">1x</button>
                <button class="zoom-btn" data-zoom="2" id="btn-2x">2x</button>
            </div>
            <button id="capture-btn"></button>
        </div>
    </div>
    <canvas id="canvas"></canvas>
</div>

<script>
    // --- Lógica de Forzar Rotación y Pantalla Completa ---
    const rotateBtn = document.getElementById('rotate-btn');
    rotateBtn.addEventListener('click', async () => {
        if (screen.orientation && screen.orientation.lock) {
            try {
                const currentOrientation = screen.orientation.type;
                if (currentOrientation.startsWith('portrait')) {
                    await screen.orientation.lock('landscape');
                } else {
                    await screen.orientation.lock('portrait');
                }
            } catch (error) {
                alert("Pon la app en Pantalla Completa (⛶) primero para forzar la rotación.");
            }
        }
    });

    const fsBtn = document.getElementById('fullscreen-btn');
    fsBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => console.log(err));
        } else {
            document.exitFullscreen();
        }
    });

    // --- Lógica de Prefijos Personalizados ---
    const prefixSelect = document.getElementById('prefix');
    const savedPrefixes = JSON.parse(localStorage.getItem('customPrefixes')) || [];
    savedPrefixes.forEach(pref => {
        const opt = document.createElement('option');
        opt.value = pref;
        opt.textContent = pref;
        prefixSelect.insertBefore(opt, prefixSelect.querySelector('option[value="_ADD_"]'));
    });

    prefixSelect.addEventListener('change', function() {
        if (this.value === '_ADD_') {
            const newPrefix = prompt("Escribe el nuevo prefijo:");
            if (newPrefix && newPrefix.trim() !== "") {
                const formattedPrefix = newPrefix.trim().toUpperCase().replace(/[^A-Z0-9_-]/g, ''); 
                if (![...this.options].some(opt => opt.value === formattedPrefix)) {
                    const opt = document.createElement('option');
                    opt.value = formattedPrefix;
                    opt.textContent = formattedPrefix;
                    this.insertBefore(opt, this.querySelector('option[value="_ADD_"]'));
                    savedPrefixes.push(formattedPrefix);
                    localStorage.setItem('customPrefixes', JSON.stringify(savedPrefixes));
                }
                this.value = formattedPrefix; 
            } else {
                this.selectedIndex = 0; 
            }
        }
    });

    // --- Lógica de Cámara, Zoom y Topografía ---
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let currentData = { lat: 0, lon: 0, alt: 0, acc: 0, utmE: 0, utmN: 0, zone: "", address: "Buscando satélites..." };
    let videoTrack = null;

    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } } })
        .then(stream => {
            video.srcObject = stream;
            videoTrack = stream.getVideoTracks()[0];
            
            const capabilities = videoTrack.getCapabilities();
            if (capabilities.zoom) {
                const zoomPanel = document.getElementById('zoom-panel');
                const btn05x = document.getElementById('btn-05x');
                const zoomBtns = document.querySelectorAll('.zoom-btn');
                
                zoomPanel.style.display = 'flex';
                
                const minZoom = capabilities.zoom.min || 1;
                const maxZoom = capabilities.zoom.max || 10;
                
                // Mostrar 0.5x solo si la cámara nativa lo soporta
                if (minZoom <= 0.5) {
                    btn05x.style.display = 'flex';
                }

                const applyZoom = (val) => {
                    let targetZoom = Math.max(minZoom, Math.min(val, maxZoom));
                    
                    try {
                        videoTrack.applyConstraints({advanced: [{zoom: targetZoom}]});
                    } catch (e) { console.error("Error al aplicar zoom:", e); }
                    
                    zoomBtns.forEach(b => b.classList.remove('active'));
                    const matchingBtn = document.querySelector(`.zoom-btn[data-zoom="${val}"]`);
                    if(matchingBtn) matchingBtn.classList.add('active');
                };

                // Asignar eventos seguros a los botones
                zoomBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        applyZoom(parseFloat(btn.dataset.zoom));
                    });
                    btn.addEventListener('touchstart', (e) => e.stopPropagation());
                });
            }
        })
        .catch(err => alert("Error de cámara: " + err));

    // Geolocalización
    if (navigator.geolocation) {
        navigator.geolocation.watchPosition(async position => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            currentData.acc = position.coords.accuracy ? position.coords.accuracy.toFixed(1) : "N/D";
            currentData.alt = position.coords.altitude ? position.coords.altitude.toFixed(1) : "N/D";
            
            const utmZone = Math.floor((lon + 180) / 6) + 1;
            const hemisphere = lat >= 0 ? 'N' : 'S';
            currentData.zone = `${utmZone}${hemisphere}`;
            
            proj4.defs(`EPSG:UTM${utmZone}`, `+proj=utm +zone=${utmZone} +datum=WGS84 +units=m +no_defs`);
            const utm = proj4('EPSG:4326', `EPSG:UTM${utmZone}`, [lon, lat]);
            
            currentData.utmE = utm[0].toFixed(2);
            currentData.utmN = utm[1] < 0 ? (utm[1] + 10000000).toFixed(2) : utm[1].toFixed(2);

            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                const data = await res.json();
                const d = data.address;
                currentData.address = `${d.county || d.city || d.town || ''}, ${d.state || ''}`;
            } catch(e) { currentData.address = "Coordenadas capturadas"; }
        }, err => console.warn(err), { enableHighAccuracy: true });
    }

    function drawRoundedRect(ctx, x, y, width, height, radius) {
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + width - radius, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
        ctx.lineTo(x + width, y + height - radius);
        ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        ctx.lineTo(x + radius, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
        ctx.fill();
    }

    // Acción de Captura
    document.getElementById('capture-btn').addEventListener('click', () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const w = canvas.width;
        const h = canvas.height;
        const fontSize = Math.max(Math.floor(w * 0.016), 14); 
        const iconSize = fontSize * 1.1;
        
        // 1. Dibujar Logo con Fondo Transparente Blanco (70%)
        const logo = document.getElementById('logo-preview');
        const logoSize = w * 0.12; 
        const logoH = logoSize * (logo.height/logo.width);
        const logoX = w - logoSize - (w*0.02);
        const logoY = h*0.02;

        ctx.fillStyle = "rgba(255, 255, 255, 0.7)"; 
        drawRoundedRect(ctx, logoX - 10, logoY - 10, logoSize + 20, logoH + 20, 12);
        ctx.drawImage(logo, logoX, logoY, logoSize, logoH);

        // 2. Panel Derecho (Datos)
        const now = new Date();
        const dateStr = now.toLocaleDateString('es-PE', { year: 'numeric', month: '2-digit', day: '2-digit' });
        const timeStr = now.toLocaleTimeString('es-PE', { hour: '2-digit', minute:'2-digit', second:'2-digit' });
        const projectName = document.getElementById('project').value.trim();
        
        ctx.font = `bold ${fontSize}px "Roboto Mono", monospace`;
        
        const lines = [];
        if(projectName !== "") lines.push({ text: `PRY: ${projectName.toUpperCase()}`, icon: "📂", color: "#FFEB3B" });
        lines.push({ text: currentData.address, icon: "📍", color: "#FFFFFF" });
        lines.push({ text: `E: ${currentData.utmE}  N: ${currentData.utmN}`, icon: "📐", color: "#FFFFFF" });
        lines.push({ text: `Datum: WGS84  Zona: ${currentData.zone}`, icon: "🌐", color: "#90CAF9" });
        lines.push({ text: `Alt: ${currentData.alt}m  Prec: ±${currentData.acc}m`, icon: "🏔️", color: "#A5D6A7" });
        lines.push({ text: `${dateStr}    ${timeStr}`, icon: "⏱️", color: "#FFFFFF" });

        let maxRightWidth = 0;
        lines.forEach(line => {
            const width = ctx.measureText(line.text).width + iconSize + 15;
            if(width > maxRightWidth) maxRightWidth = width;
        });

        const padX = w * 0.015; 
        const padY = h * 0.015; 
        const lineHeight = fontSize * 1.6;
        const borderRadius = 12; 
        
        const rectWRight = maxRightWidth + (padX * 2);
        const rectHRight = (lineHeight * lines.length) + (padY * 2);
        const rectXRight = w - rectWRight - (w * 0.02);
        const rectYRight = h - rectHRight - (h * 0.02);

        ctx.fillStyle = "rgba(10, 10, 12, 0.75)";
        drawRoundedRect(ctx, rectXRight, rectYRight, rectWRight, rectHRight, borderRadius);
        ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
        ctx.lineWidth = 2;
        ctx.stroke();
        
        lines.forEach((line, index) => {
            const yPos = rectYRight + padY + fontSize + (lineHeight * index);
            ctx.fillStyle = "rgba(255,255,255,0.9)";
            ctx.font = `${iconSize}px Arial`; 
            ctx.fillText(line.icon, rectXRight + padX, yPos);
            ctx.fillStyle = line.color;
            ctx.font = `bold ${fontSize}px "Roboto Mono", monospace`;
            ctx.fillText(line.text, rectXRight + padX + iconSize + 10, yPos);
        });

        // 3. Panel Izquierdo (Nomenclatura)
        const prefix = document.getElementById('prefix').value;
        const num = document.getElementById('num').value.padStart(3, '0');
        const desc = document.getElementById('desc').value.trim();
        const fileName = `${prefix}_${num}${desc ? '_' + desc : ''}`;
        
        const fullLeftText = fileName;
        ctx.font = `bold ${fontSize * 1.2}px "Roboto Mono", monospace`; 
        const maxLeftWidth = ctx.measureText(fullLeftText).width;
        
        const rectWLeft = maxLeftWidth + (padX * 2);
        const rectHLeft = (fontSize * 1.2) + (padY * 2);
        const rectXLeft = w * 0.02;
        const rectYLeft = h - rectHLeft - (h * 0.02);

        ctx.fillStyle = "rgba(10, 10, 12, 0.75)";
        drawRoundedRect(ctx, rectXLeft, rectYLeft, rectWLeft, rectHLeft, borderRadius);
        ctx.stroke(); 
        
        const prefixText = `${prefix}_`;
        ctx.fillStyle = "#F44336"; 
        ctx.fillText(prefixText, rectXLeft + padX, rectYLeft + padY + (fontSize * 1.2));
        
        ctx.fillStyle = "#FFFFFF";
        const prefixWidth = ctx.measureText(prefixText).width;
        ctx.fillText(`${num}${desc ? '_' + desc : ''}`, rectXLeft + padX + prefixWidth, rectYLeft + padY + (fontSize * 1.2));

        const link = document.createElement('a');
        link.download = fileName + '.jpg';
        link.href = canvas.toDataURL('image/jpeg', 0.95);
        link.click();
    });
</script>
</body>
</html>
