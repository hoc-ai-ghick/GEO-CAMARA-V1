        /* Formularios ocultos */

        #new-prefix-container {

        #new-prefix-container input {

        @media (max-width: 600px) {
            #bottom-left-panel { bottom: 120px; width: calc(100% - 30px); left: 15px; }
            #bottom-right-panel { bottom: 20px; right: 15px; text-align: left; left: 15px; width: calc(100% - 30px); display: flex; flex-direction: column;}
            #bottom-right-panel span { text-align: left; }
            #capture-btn { bottom: 20px; right: 20px; left: auto; transform: none; width: 50px; height: 50px;}
        }

        <div class="flex flex-wrap gap-1" id="prefixContainer">

        </div>
        
        <div id="newPrefixDiv" class="hidden flex gap-1">
            <input type="text" id="newPrefixInput" placeholder="Ej: Pto_" class="w-full text-xs p-1 rounded text-black outline-none">

<script>
    // --- VARIABLES Y ELEMENTOS ---
    const video = document.getElementById('camera');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const descriptionInput = document.getElementById('description');
    const fileNamePreview = document.getElementById('fileNamePreview');
    const prefixButtons = document.querySelectorAll('.prefix-btn');
    const addPrefixBtn = document.getElementById('addPrefixBtn');
    const newPrefixDiv = document.getElementById('newPrefixDiv');
    const newPrefixInput = document.getElementById('newPrefixInput');
    const savePrefixBtn = document.getElementById('savePrefixBtn');
    const prefixContainer = document.getElementById('prefixContainer');
    const logoUpload = document.getElementById('logoUpload');
    const logoPreview = document.getElementById('logoPreview');
    const lblUpload = document.getElementById('lblUpload');

    let defaultLogoLoaded = false;
    let logoImageObj = new Image();
    
    // INTENTAR CARGAR LOGO POR DEFECTO ("logo.png" en la misma carpeta)
    logoImageObj.src = 'logo.png';
    logoImageObj.onload = () => {
        logoPreview.src = logoImageObj.src;
        logoPreview.classList.remove('hidden');
        lblUpload.innerText = "Cambiar Logo";
        defaultLogoLoaded = true;
    };
    logoImageObj.onerror = () => {
        // Si no hay logo.png en el servidor, no pasa nada, espera a que se suba uno
        logoImageObj = null;
        lblUpload.innerText = "Cargar Logo";
    };

    // --- CARGA DE LOGO MANUAL ---
    logoUpload.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                logoImageObj = new Image();
                logoImageObj.src = event.target.result;
                logoImageObj.onload = () => {
                    logoPreview.src = logoImageObj.src;
                    logoPreview.classList.remove('hidden');
                    lblUpload.innerText = "Cambiar Logo";
                    defaultLogoLoaded = true;
                };
            };
            reader.readAsDataURL(file);
        }
    });

    // --- CÁMARA ---
    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } 
            });
            video.srcObject = stream;
        } catch (err) {
            console.error("Error al acceder a la cámara: ", err);
            alert("No se pudo acceder a la cámara. Por favor, da permisos.");
        }
    }
    startCamera();

    // --- MANEJO DE PREFIJOS Y NOMBRE DE ARCHIVO ---
    let currentPrefix = '#C';

    function updateFileName() {
        let desc = descriptionInput.value.trim().replace(/[^a-zA-Z0-9_\- ]/g, "");
        desc = desc.replace(/\s+/g, "_");
        let finalName = currentPrefix;
        if (desc.length > 0) finalName += (currentPrefix.endsWith('_') ? '' : '_') + desc;
        finalName += '.jpg';
        fileNamePreview.innerText = finalName;
    }

    descriptionInput.addEventListener('input', updateFileName);

    function attachPrefixEvent(btn) {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.prefix-btn').forEach(b => {
                b.classList.remove('bg-blue-600');
                b.classList.add('bg-gray-700');
            });
            btn.classList.remove('bg-gray-700');
            btn.classList.add('bg-blue-600');
            currentPrefix = btn.getAttribute('data-prefix');
            updateFileName();
        });
    }

    document.querySelectorAll('.prefix-btn').forEach(attachPrefixEvent);
    // Seleccionar el primero por defecto
    document.querySelector('.prefix-btn').classList.replace('bg-gray-700', 'bg-blue-600');

    addPrefixBtn.addEventListener('click', () => {
        newPrefixDiv.classList.remove('hidden');
        newPrefixInput.focus();
    });

    savePrefixBtn.addEventListener('click', () => {
        let newPref = newPrefixInput.value.trim();
        if (newPref) {
            const newBtn = document.createElement('button');
            newBtn.className = 'bg-gray-700 hover:bg-gray-600 text-white text-xs py-1 px-2 rounded prefix-btn';
            newBtn.setAttribute('data-prefix', newPref);
            newBtn.innerText = newPref;
            prefixContainer.insertBefore(newBtn, addPrefixBtn);
            attachPrefixEvent(newBtn);
            newBtn.click();
        }
        newPrefixInput.value = '';
        newPrefixDiv.classList.add('hidden');
    });

    // --- RELOJ ---
    function updateClock() {
        const now = new Date();
        const dd = String(now.getDate()).padStart(2, '0');
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const yyyy = now.getFullYear();
        const hh = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        
        const dateStr = `${dd}/${mm}/${yyyy}`;
        const timeStr = `${hh}:${min}`;
        
        document.getElementById('locDateTime').innerText = `${dateStr}   ${timeStr}`;
        return { dateStr, timeStr };
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- GEOLOCALIZACIÓN Y UTM SIMULADA ---
    let geoData = { easting: "000000.00", northing: "0000000.00", location: "Buscando...", alt: "--" };

    function updateGeolocation() {
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const alt = position.coords.altitude;
                
                geoData.alt = alt !== null ? Math.round(alt) : "--";
                document.getElementById('locAltitude').innerText = `Altitud: ${geoData.alt} msnm`;

                // Simulación UTM rápida para el prototipo (requeriría librería como proj4js en prod real)
                geoData.easting = (500000 + (lon * 111000 * Math.cos(lat * Math.PI / 180))).toFixed(2);
                geoData.northing = (10000000 + (lat * 111000)).toFixed(2);
                
                document.getElementById('locE').innerText = geoData.easting;
                document.getElementById('locN').innerText = geoData.northing;

                // Geocodificación inversa (OpenStreetMap Nominatim)
                try {
                    const res = await fetch(`[https://nominatim.openstreetmap.org/reverse?format=json&lat=$](https://nominatim.openstreetmap.org/reverse?format=json&lat=$){lat}&lon=${lon}`);
                    const data = await res.json();
                    if(data && data.address) {
                        const dist = data.address.city_district || data.address.suburb || data.address.neighbourhood || "";
                        const prov = data.address.city || data.address.county || "";
                        const dep = data.address.state || data.address.region || "";
                        
                        let locStr = [dist, prov, dep].filter(Boolean).join(", ").toUpperCase();
                        geoData.location = locStr.length > 0 ? locStr : "UBICACIÓN NO ENCONTRADA";
                        document.getElementById('locLocation').innerText = geoData.location;
                    }
                } catch (e) {
                    geoData.location = "LAT: " + lat.toFixed(4) + " LON: " + lon.toFixed(4);
                    document.getElementById('locLocation').innerText = geoData.location;
                }
            }, (error) => {
                console.error("Error GPS: ", error);
                document.getElementById('locLocation').innerText = "GPS DESACTIVADO";
            }, { enableHighAccuracy: true });
        }
    }
    updateGeolocation();

    // --- CAPTURA DE IMAGEN ---
    document.getElementById('captureBtn').addEventListener('click', () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // Dibujar el fotograma del video
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // CONFIGURACIÓN DE FUENTE Y ESTILOS GLOBALES
        ctx.font = "bold 28px 'Segoe UI', Tahoma, sans-serif";
        const padding = 20;

        // 1. DIBUJAR PANEL INFERIOR DERECHO (Coordenadas y Ubicación)
        ctx.textAlign = "right";
        ctx.textBaseline = "top";
        
        // Textos a dibujar
        const timeData = updateClock();
        const line1 = geoData.location;
        const line2 = `E: ${geoData.easting}    N: ${geoData.northing}`;
        const line3 = `${timeData.dateStr}   ${timeData.timeStr}`;
        const line4 = `Altitud: ${geoData.alt} msnm`;

        // Medir ancho para dibujar el fondo negro translúcido
        ctx.font = "bold 32px 'Segoe UI', Tahoma, sans-serif"; // Fuente un poco más grande para la foto
        const w1 = ctx.measureText(line1).width;
        const w2 = ctx.measureText(line2).width;
        const w3 = ctx.measureText(line3).width;
        const w4 = ctx.measureText(line4).width;
        const maxTextWidth = Math.max(w1, w2, w3, w4);
        
        const boxWidth = maxTextWidth + 40;
        const boxHeight = 180;
        const boxX = canvas.width - boxWidth - padding;
        const boxY = canvas.height - boxHeight - padding;

        // Fondo Negro al 60%
        ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
        ctx.fillRect(boxX, boxY, boxWidth, boxHeight);

        // Escribir Textos en Blanco
        ctx.fillStyle = "#ffffff";
        let textRightX = canvas.width - padding - 20;
        let startY = boxY + 20;

        ctx.font = "bold 32px 'Segoe UI', Tahoma, sans-serif";
        ctx.fillText(line1, textRightX, startY);
        
        ctx.font = "normal 30px 'Segoe UI', Tahoma, sans-serif";
        ctx.fillText(line2, textRightX, startY + 40);
        ctx.fillText(line3, textRightX, startY + 80);
        ctx.fillText(line4, textRightX, startY + 120);

        // 2. DIBUJAR PANEL INFERIOR IZQUIERDO (Descripción)
        const descText = descriptionInput.value.trim();
        if (descText !== "") {
            ctx.textAlign = "left";
            ctx.font = "bold 32px 'Segoe UI', Tahoma, sans-serif";
            const descW = ctx.measureText(descText).width;
            const descBoxW = descW + 40;
            const descBoxH = 60;
            const descBoxX = padding;
            const descBoxY = canvas.height - descBoxH - padding;

            ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
            ctx.fillRect(descBoxX, descBoxY, descBoxW, descBoxH);
            
            ctx.fillStyle = "#ffffff";
            ctx.fillText(descText, descBoxX + 20, descBoxY + 12);
        }

        // 3. DIBUJAR LOGO (Superior Derecho)
        if (logoImageObj) {
            const maxLogoHeight = 120;
            const logoRatio = logoImageObj.width / logoImageObj.height;
            const logoWidth = maxLogoHeight * logoRatio;
            
            // Fondo blanco para el logo (opcional, igual que la app)
            const logoBoxX = canvas.width - logoWidth - (padding * 2);
            const logoBoxY = padding;
            
            ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
            ctx.fillRect(logoBoxX - 10, logoBoxY - 10, logoWidth + 20, maxLogoHeight + 20);
            
            ctx.drawImage(logoImageObj, logoBoxX, logoBoxY, logoWidth, maxLogoHeight);
        }

        // DESCARGAR IMAGEN
        const dataURL = canvas.toDataURL('image/jpeg', 0.9);
        const link = document.createElement('a');
        link.download = fileNamePreview.innerText;
        link.href = dataURL;
        link.click();
    });
</script>
