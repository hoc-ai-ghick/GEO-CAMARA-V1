<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cámara Topográfica PWA</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    <style>
        html, body { 
            margin: 0; padding: 0; 
            width: 100%; height: 100%; height: 100dvh; 
            background: #000; color: white; font-family: sans-serif; 
            overflow: hidden; position: fixed; 
        }
        #camera-container { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; align-items: center; }
        video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        canvas { display: none; }
        
        #logo-preview { position: absolute; top: 20px; right: 20px; z-index: 10; width: clamp(60px, 15vw, 100px); opacity: 0.9; }

        .bottom-bar { 
            position: absolute; z-index: 20; bottom: 0; left: 0; width: 100%; 
            padding: 15px; box-sizing: border-box; 
            background: linear-gradient(transparent, rgba(0,0,0,0.8)); 
            display: flex; flex-direction: row; justify-content: space-between; align-items: flex-end;
        }

        @media (max-width: 600px) {
            .bottom-bar { flex-direction: column; align-items: center; gap: 15px; padding-bottom: 30px; }
            .naming-panel { width: 100%; justify-content: center; }
        }
        
        .naming-panel { display: flex; gap: 5px; flex-wrap: wrap; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 8px; }
        .naming-panel select, .naming-panel input { font-size: 16px; padding: 6px; border: none; border-radius: 4px; }
        .naming-panel select { color: red; font-weight: bold; background: #fff; }
        .naming-panel input[type="number"] { width: 60px; text-align: center; }
        .naming-panel input[type="text"] { flex-grow: 1; max-width: 150px; text-align: left; }
        
        #capture-btn { 
            background: #fff; border: 5px solid #aaa; 
            width: 70px; height: 70px; border-radius: 50%; 
            cursor: pointer; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #capture-btn:active { background: #ccc; transform: scale(0.95); }
    </style>
</head>
<body>

<div id="camera-container">
    <video id="video" autoplay playsinline></video>
    <img id="logo-preview" src="logo.png" alt="Logo" crossorigin="anonymous" onerror="this.src='https://via.placeholder.com/150?text=LOGO'">
    
    <div class="bottom-bar">
        <div class="naming-panel">
            <select id="prefix">
                <option value="GEO">GEO</option>
                <option value="GEONORT">GEONORT</option>
                <option value="EST">EST</option>
                <option value="CAL">CAL</option>
            </select>
            <span style="color:white; align-self:center; font-weight:bold;">_</span>
            <input type="number" id="num" placeholder="066" value="066">
            <span style="color:white; align-self:center; font-weight:bold;">_</span>
            <input type="text" id="desc" placeholder="descripción">
        </div>
        <button id="capture-btn"></button>
    </div>
    <canvas id="canvas"></canvas>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let currentData = { lat: 0, lon: 0, alt: 0, utmE: 0, utmN: 0, address: "Buscando ubicación..." };

    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } } })
        .then(stream => video.srcObject = stream)
        .catch(err => alert("Error al acceder a la cámara: " + err));

    if (navigator.geolocation) {
        navigator.geolocation.watchPosition(async position => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            currentData.alt = position.coords.altitude ? position.coords.altitude.toFixed(2) : "N/D";
            
            const utmZone = Math.floor((lon + 180) / 6) + 1;
            proj4.defs(`EPSG:UTM${utmZone}`, `+proj=utm +zone=${utmZone} +datum=WGS84 +units=m +no_defs`);
            const utm = proj4('EPSG:4326', `EPSG:UTM${utmZone}`, [lon, lat]);
            currentData.utmE = utm[0].toFixed(2);
            currentData.utmN = utm[1].toFixed(2);

            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                const data = await res.json();
                const d = data.address;
                currentData.address = `${d.county || d.city || ''}, ${d.state || ''}, ${d.country || ''}`;
            } catch(e) { currentData.address = "Coordenadas obtenidas"; }
        }, err => console.warn(err), { enableHighAccuracy: true });
    }

    // Función auxiliar para dibujar rectángulos con esquinas redondeadas
    function drawRoundedRect(ctx, x, y, width, height, radius) {
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + width - radius, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
        ctx.lineTo(x + width, y + height - radius);
        ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        ctx.lineTo(x + radius, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
        ctx.fill();
    }

    document.getElementById('capture-btn').addEventListener('click', () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const w = canvas.width;
        const h = canvas.height;
        const fontSize = Math.max(Math.floor(w * 0.018), 16); 
        ctx.font = `bold ${fontSize}px Arial`;
        
        // 1. Dibujar Logo
        const logo = document.getElementById('logo-preview');
        const logoSize = w * 0.15; 
        ctx.drawImage(logo, w - logoSize - (w*0.02), h*0.02, logoSize, logoSize * (logo.height/logo.width));

        // 2. Textos de la Derecha (Ubicación)
        const now = new Date();
        const dateStr = now.toLocaleDateString('es-PE');
        const timeStr = now.toLocaleTimeString('es-PE');
        
        const line1 = currentData.address;
        const line2 = `E: ${currentData.utmE}   N: ${currentData.utmN}`;
        const line3 = `${dateStr}   ${timeStr}`; // 3 espacios añadidos entre fecha y hora
        const line4 = `Altitud: ${currentData.alt} msnm`;

        // Calcular el ancho de la línea más larga para ajustar la caja
        const metrics1 = ctx.measureText(line1).width;
        const metrics2 = ctx.measureText(line2).width;
        const metrics3 = ctx.measureText(line3).width;
        const metrics4 = ctx.measureText(line4).width;
        const maxRightWidth = Math.max(metrics1, metrics2, metrics3, metrics4);

        const padX = w * 0.015; // Relleno horizontal dinámico
        const padY = h * 0.015; // Relleno vertical dinámico
        const lineHeight = fontSize * 1.5;
        const borderRadius = 15; // Curvatura de las esquinas
        
        // Dimensiones del fondo derecho
        const rectWRight = maxRightWidth + (padX * 2);
        const rectHRight = (lineHeight * 4) + (padY * 2);
        const rectXRight = w - rectWRight - (w * 0.02);
        const rectYRight = h - rectHRight - (h * 0.02);

        // Dibujar fondo derecho (redondeado y ajustado)
        ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
        drawRoundedRect(ctx, rectXRight, rectYRight, rectWRight, rectHRight, borderRadius);
        
        // Escribir texto derecho
        ctx.fillStyle = "white";
        ctx.fillText(line1, rectXRight + padX, rectYRight + padY + fontSize);
        ctx.fillText(line2, rectXRight + padX, rectYRight + padY + fontSize + lineHeight);
        ctx.fillText(line3, rectXRight + padX, rectYRight + padY + fontSize + (lineHeight * 2));
        ctx.fillText(line4, rectXRight + padX, rectYRight + padY + fontSize + (lineHeight * 3));

        // 3. Textos de la Izquierda (Nomenclatura)
        const prefix = document.getElementById('prefix').value;
        const num = document.getElementById('num').value.padStart(3, '0');
        const desc = document.getElementById('desc').value;
        const fileName = `${prefix}_${num}${desc ? '_' + desc : ''}`;
        
        const prefixText = `${prefix}_`;
        const sufixText = `${num}${desc ? '_' + desc : ''}`;
        const fullLeftText = prefixText + sufixText;

        // Calcular el ancho exacto del texto izquierdo
        const maxLeftWidth = ctx.measureText(fullLeftText).width;
        
        // Dimensiones del fondo izquierdo
        const rectWLeft = maxLeftWidth + (padX * 2);
        const rectHLeft = lineHeight + (padY * 2);
        const rectXLeft = w * 0.02;
        const rectYLeft = h - rectHLeft - (h * 0.02);

        // Dibujar fondo izquierdo (redondeado y ajustado)
        ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
        drawRoundedRect(ctx, rectXLeft, rectYLeft, rectWLeft, rectHLeft, borderRadius);
        
        // Escribir texto izquierdo (Rojo y Blanco)
        ctx.fillStyle = "red";
        ctx.fillText(prefixText, rectXLeft + padX, rectYLeft + padY + fontSize);
        
        ctx.fillStyle = "white";
        const prefixWidth = ctx.measureText(prefixText).width;
        ctx.fillText(sufixText, rectXLeft + padX + prefixWidth, rectYLeft + padY + fontSize);

        // Descargar Imagen
        const link = document.createElement('a');
        link.download = fileName + '.jpg';
        link.href = canvas.toDataURL('image/jpeg', 0.95);
        link.click();
    });
</script>
</body>
</html>
